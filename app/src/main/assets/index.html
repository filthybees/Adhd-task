<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b23"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Daily Reset"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Daily Reset — Life & Home</title><style>
:root{color-scheme:dark;--bg:#0b141b;--panel:#14222b;--panel2:#1b2c35;--edge:#2b424c;--txt:#ecf4f3;--muted:#a1b7b9;--accent:#a9e7cc;--accentdark:#103629;--gold:#f8d69a;--blue:#b3d7ff;--red:#ffb6b1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.shell{max-width:730px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 99px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:13px;font-weight:800;letter-spacing:.15em;color:var(--accent);text-transform:uppercase}.subhead{color:var(--muted);font-size:13px;margin-top:5px}.heading{font-size:30px;letter-spacing:-.04em;margin:3px 0 0;line-height:1.1}.avatar{background:var(--panel2);border:1px solid var(--edge);border-radius:16px;padding:11px;font-size:22px}button.icon{background:var(--panel2);border:1px solid var(--edge);border-radius:12px;color:var(--txt);padding:9px 12px}h2{font-size:20px;margin:0 0 10px;letter-spacing:-.02em}h3{font-size:16px;margin:0}.hero{background:linear-gradient(125deg,#21463e,#152d36 75%);padding:20px;border-radius:23px;border:1px solid #416459;margin:10px 0 22px;display:grid;grid-template-columns:1fr 100px;align-items:center;gap:14px}.hero .eyebrow{font-size:12px;letter-spacing:.1em;color:#c2e8d8;text-transform:uppercase;font-weight:700}.hero h2{font-size:27px;margin:7px 0 5px}.hero p{font-size:13px;color:#c6ddd7;margin:0;line-height:1.5}.ring{width:100px;height:100px;border-radius:100%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--pct,0%),#426259 0)}.ring-inner{background:#19362f;width:78px;height:78px;display:grid;place-items:center;border-radius:100%;font-size:24px;font-weight:800}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.chip{background:var(--panel2);border:1px solid var(--edge);border-radius:999px;color:var(--muted);padding:9px 14px;white-space:nowrap;font-size:13px;font-weight:700}.chip.active{background:var(--accent);color:#15352a;border-color:var(--accent)}.section-header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:25px 2px 12px}.section-header small{color:var(--muted)}.routine{background:var(--panel);border:1px solid var(--edge);border-radius:18px;margin:10px 0;overflow:hidden}.routine-head{width:100%;display:flex;align-items:center;text-align:left;gap:12px;background:transparent;color:var(--txt);border:0;padding:15px}.routine-icon{background:#25433e;border-radius:12px;padding:10px;font-size:20px}.routine-desc{flex:1;min-width:0}.routine-desc small{color:var(--muted);font-size:12px}.chev{color:var(--muted);font-size:14px}.progress-track{background:#294048;height:5px;border-radius:20px;overflow:hidden;margin-top:8px}.progress-fill{height:100%;background:var(--accent);transition:width .2s}.tasks{padding:0 13px 11px}.task{border-top:1px solid #263a44;display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:12px 4px;color:var(--txt);line-height:1.4;font-size:14px}.task input{appearance:none;border:2px solid #779296;border-radius:7px;width:23px;height:23px;flex:0 0 23px;margin:0;display:grid;place-items:center}.task input:checked{background:var(--accent);border-color:var(--accent)}.task input:checked:after{content:'✓';font-size:17px;font-weight:900;color:#18372d}.task.checked span{text-decoration:line-through;color:#829b9d}.tag{display:inline-block;color:var(--gold);font-size:10px;font-weight:700;margin-left:8px;white-space:nowrap}.empty{background:var(--panel);border:1px dashed var(--edge);border-radius:18px;padding:25px;text-align:center;color:var(--muted);line-height:1.6}.card{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:17px;margin:10px 0}.card p{font-size:14px;color:var(--muted);line-height:1.6;margin:6px 0}.day-picker{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:16px}.day{border:1px solid var(--edge);border-radius:12px;background:var(--panel2);color:var(--muted);min-height:55px;font-size:12px;font-weight:700}.day.selected{background:var(--accent);color:#16342b}.day .n{font-size:11px;opacity:.7;display:block;margin-top:4px}.nav{position:fixed;bottom:0;left:0;right:0;background:#101e26f2;border-top:1px solid var(--edge);display:flex;justify-content:center;padding:9px 8px calc(env(safe-area-inset-bottom) + 9px);backdrop-filter:blur(15px);z-index:5}.nav-inner{max-width:730px;display:grid;grid-template-columns:repeat(4,1fr);width:100%}.nav button{border:0;background:none;color:#8da5a9;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;font-size:11px;font-weight:700}.nav button.active{color:var(--accent)}.nav .symbol{font-size:23px}.btn{background:var(--accent);color:#143528;border:0;border-radius:12px;padding:12px 16px;font-weight:800}.btn.secondary{background:var(--panel2);border:1px solid var(--edge);color:var(--txt)}.btn.danger{background:#4f292a;color:#ffd8d4}.btn:disabled{opacity:.5}.stack{display:grid;gap:11px}label.field{display:grid;gap:6px;font-size:13px;color:var(--muted)}input.text,select.text,textarea.text{width:100%;border:1px solid #44606a;border-radius:11px;background:#101e26;color:var(--txt);padding:12px;min-height:45px}textarea{min-height:78px}.helper{font-size:12px;color:var(--muted);line-height:1.55}.micro{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 15px}.itemline{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--edge);padding:13px 0;font-size:13px}.itemline:first-of-type{border-top:0}.itemline small{display:block;color:var(--muted);margin-top:4px}.mini{border:1px solid var(--edge);background:var(--panel2);border-radius:10px;padding:8px 11px;color:var(--txt)}.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.pill{font-size:11px;color:var(--muted);background:#22353c;padding:5px 8px;border-radius:7px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--accent);color:#173529;border-radius:10px;padding:11px 16px;font-size:13px;font-weight:800;z-index:11;box-shadow:0 8px 30px #0008;max-width:90vw;text-align:center}.info{background:#24302f;color:#d0e5dc;border-radius:13px;padding:13px;font-size:13px;line-height:1.55}.hidden{display:none!important}@media(min-width:700px){.shell{padding-top:28px}.heading{font-size:36px}}
</style></head><body><main id="app" class="shell"></main><nav class="nav" aria-label="Main navigation"><div class="nav-inner"><button data-nav="today" class="active"><span class="symbol">☀</span>Today</button><button data-nav="week"><span class="symbol">▦</span>Week</button><button data-nav="plan"><span class="symbol">☷</span>All tasks</button><button data-nav="settings"><span class="symbol">⚙</span>Settings</button></div></nav><script src="app.js" defer></script></body></html>
